[project]
name = "previsao-carga-energia"
version = "0.1.0"
description = "Pipeline de previsão de carga diária de energia elétrica (ONS - Subsistema SE/CO) para 7 dias à frente."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.16.0",
    "scikit-learn>=1.5.0",
    "holidays>=0.58",
    "requests>=2.32.0",
    "pypdf>=5.0.0",
    "statsforecast>=1.7.8",
    "plotly>=5.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
